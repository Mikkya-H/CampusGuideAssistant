<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>校园导览 - 智慧迎新系统</title>
    <style>#mainNav{background:linear-gradient(135deg,#059669,#10B981)!important;}</style>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navbar}"></th:block>

    <!-- 页面头部 -->
    <section class="page-header page-header--campus">
        <div class="container">
            <h2 class="fw-bold mb-1"><i class="bi bi-geo-alt-fill"></i> 校园导览</h2>
            <p class="mb-0 opacity-75">探索校园建筑，熟悉学习生活环境</p>
        </div>
    </section>

    <div class="container py-5">
        <!-- 校园平面图 -->
        <div class="card border-0 shadow-sm mb-5">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold"><i class="bi bi-map"></i> 校园平面图</h5>
                <small class="text-muted">点击图片可放大查看</small>
            </div>
            <div class="card-body p-3 text-center">
                <a th:href="@{/images/平面地图.jpg}" target="_blank" title="点击查看大图">
                    <img th:src="@{/images/平面地图.jpg}"
                         alt="东北石油大学校园平面图"
                         class="img-fluid rounded"
                         style="max-height: 500px; cursor: zoom-in;">
                </a>
            </div>
        </div>

        <!-- 空状态 -->
        <th:block th:if="${#lists.isEmpty(buildings)}">
            <div class="text-center text-muted py-5">
                <i class="bi bi-building" style="font-size: 4rem;"></i>
                <h4 class="mt-3">暂无建筑信息</h4>
                <p>校园建筑信息正在更新中，敬请期待</p>
            </div>
        </th:block>

        <!-- 建筑卡片网格 -->
        <div class="row g-4" th:unless="${#lists.isEmpty(buildings)}">
            <div class="col-md-6 col-lg-4" th:each="building : ${buildings}">
                <div class="card h-100 border-0 shadow-sm hover-shadow">
                    <div class="card-img-top bg-light d-flex align-items-center justify-content-center" style="height: 180px;">
                        <img th:src="${building.imageUrl} ?: @{/images/building-placeholder.png}"
                             th:alt="${building.name}"
                             class="img-fluid"
                             style="max-height: 100%; object-fit: cover;"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <i class="bi bi-building-fill text-muted" style="font-size: 4rem; display: none;"></i>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title mb-0" th:text="${building.name}">建筑名称</h5>
                            <span class="badge bg-primary" th:text="${building.category}">分类</span>
                        </div>
                        <p class="card-text text-muted small" th:if="${building.description != null}" th:text="${building.description}">
                            建筑简介描述信息
                        </p>
                        <p class="card-text text-muted small" th:unless="${building.description != null}">暂无简介</p>
                    </div>
                    <div class="card-footer bg-white border-0">
                        <a th:href="@{/campus/{id}(id=${building.id})}" class="btn btn-outline-primary btn-sm w-100">
                            查看详情 <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/common :: footer}"></th:block>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
