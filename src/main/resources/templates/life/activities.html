<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>校园活动 - 智慧迎新系统</title>
    <style>#mainNav{background:linear-gradient(135deg,#DC2626,#EF4444)!important;}</style>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navbar}"></th:block>

    <section class="page-header page-header--activities">
        <div class="container">
            <h2 class="fw-bold mb-1"><i class="bi bi-calendar-event"></i> 校园活动</h2>
            <p class="mb-0 opacity-75">丰富多彩的校园活动，等你来参与</p>
        </div>
    </section>

    <div class="container py-5">
        <th:block th:if="${activities == null or #lists.isEmpty(activities)}">
            <div class="text-center text-muted py-5">
                <i class="bi bi-calendar2" style="font-size: 4rem;"></i>
                <h4 class="mt-3">暂无活动信息</h4>
                <p>校园活动正在筹备中，敬请期待</p>
            </div>
        </th:block>

        <div class="row g-4" th:if="${activities != null and !#lists.isEmpty(activities)}">
            <div class="col-md-6" th:each="act : ${activities}">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h5 class="card-title fw-bold mb-0" th:text="${act.title}">活动标题</h5>
                            <span class="badge"
                                  th:classappend="${act.status == 2} ? 'bg-success' : (${act.status == 1} ? 'bg-warning text-dark' : 'bg-secondary')"
                                  th:text="${act.status == 1} ? '报名中' : (${act.status == 2} ? '进行中' : '已结束')">状态</span>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-auto">
                                <small class="text-muted">
                                    <i class="bi bi-calendar"></i>
                                    <span th:if="${act.startTime != null}" th:text="${#temporals.format(act.startTime, 'yyyy-MM-dd')}">日期</span>
                                </small>
                            </div>
                            <div class="col-auto" th:if="${act.endTime != null}">
                                <small class="text-muted">
                                    <i class="bi bi-clock"></i>
                                    <span th:text="${#temporals.format(act.endTime, 'HH:mm')}">时间</span>
                                </small>
                            </div>
                            <div class="col-auto" th:if="${act.location != null}">
                                <small class="text-muted">
                                    <i class="bi bi-geo-alt"></i> <span th:text="${act.location}">地点</span>
                                </small>
                            </div>
                        </div>
                        <p class="text-muted small mb-2" th:text="${act.description}">活动描述</p>
                        <small class="text-muted" th:if="${act.organizer != null}">
                            <i class="bi bi-person"></i> 组织者：<span th:text="${act.organizer}">组织者</span>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/common :: footer}"></th:block>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
