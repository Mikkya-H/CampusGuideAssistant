<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>校园生活 - 智慧迎新系统</title>
    <style>#mainNav{background:linear-gradient(135deg,#DB2777,#EC4899)!important;}</style>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navbar}"></th:block>

    <section class="page-header page-header--life">
        <div class="container text-center">
            <h2 class="fw-bold display-5 mb-2"><i class="bi bi-heart-fill"></i> 校园生活</h2>
            <p class="lead opacity-90">全面了解校园生活，快速适应大学环境</p>
        </div>
    </section>

    <div class="container py-5">
        <div class="row g-4">
            <div class="col-md-6 col-lg-3">
                <a th:href="@{/life/dormitory}" class="text-decoration-none">
                    <div class="card border-0 shadow-sm h-100 text-center hover-shadow">
                        <div class="card-body p-4">
                            <div class="display-4 mb-3">🏠</div>
                            <h5 class="text-dark">宿舍信息</h5>
                            <p class="text-muted small">了解学生宿舍类型、设施配置及住宿费用</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-6 col-lg-3">
                <a th:href="@{/life/cafeteria}" class="text-decoration-none">
                    <div class="card border-0 shadow-sm h-100 text-center hover-shadow">
                        <div class="card-body p-4">
                            <div class="display-4 mb-3">🍽️</div>
                            <h5 class="text-dark">食堂指南</h5>
                            <p class="text-muted small">查看各食堂位置、特色菜品及营业时间</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-6 col-lg-3">
                <a th:href="@{/life/clubs}" class="text-decoration-none">
                    <div class="card border-0 shadow-sm h-100 text-center hover-shadow">
                        <div class="card-body p-4">
                            <div class="display-4 mb-3">🎯</div>
                            <h5 class="text-dark">社团风采</h5>
                            <p class="text-muted small">探索各类学生社团，找到志同道合的伙伴</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-6 col-lg-3">
                <a th:href="@{/life/activities}" class="text-decoration-none">
                    <div class="card border-0 shadow-sm h-100 text-center hover-shadow">
                        <div class="card-body p-4">
                            <div class="display-4 mb-3">🎉</div>
                            <h5 class="text-dark">校园活动</h5>
                            <p class="text-muted small">了解近期校园活动，丰富课余生活</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/common :: footer}"></th:block>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
