<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title th:text="${building.id != null} ? '编辑建筑' : '新增建筑'">建筑编辑</title>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navbar}"></th:block>

    <section class="bg-dark text-white py-3">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-gear"></i> 后台管理 / 建筑管理 / <span th:text="${building.id != null} ? '编辑' : '新增'">编辑</span></h5>
                <a th:href="@{/admin/buildings}" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left"></i> 返回建筑列表</a>
            </div>
        </div>
    </section>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white">
                        <h4 class="mb-0 fw-bold" th:text="${building.id != null} ? '编辑建筑' : '新增建筑'">编辑建筑</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/admin/buildings/save}" method="post">
                            <input type="hidden" name="id" th:value="${building.id}" th:if="${building.id != null}">

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">名称 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="name" required
                                           th:value="${building.name}" placeholder="如：图书馆">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">分类 <span class="text-danger">*</span></label>
                                    <select class="form-select" name="category" required>
                                        <option value="">请选择</option>
                                        <option value="教学楼" th:selected="${building.category == '教学楼'}">教学楼</option>
                                        <option value="图书馆" th:selected="${building.category == '图书馆'}">图书馆</option>
                                        <option value="办公楼" th:selected="${building.category == '办公楼'}">办公楼</option>
                                        <option value="体育馆" th:selected="${building.category == '体育馆'}">体育馆</option>
                                        <option value="体育设施" th:selected="${building.category == '体育设施'}">体育设施</option>
                                        <option value="食堂" th:selected="${building.category == '食堂'}">食堂</option>
                                        <option value="活动中心" th:selected="${building.category == '活动中心'}">活动中心</option>
                                        <option value="服务设施" th:selected="${building.category == '服务设施'}">服务设施</option>
                                        <option value="地标" th:selected="${building.category == '地标'}">地标</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">楼层数</label>
                                    <input type="number" class="form-control" name="floors"
                                           th:value="${building.floors}" placeholder="楼层数">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">地址</label>
                                <input type="text" class="form-control" name="address"
                                       th:value="${building.address}" placeholder="如：校园中心区">
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">经度</label>
                                    <input type="number" step="0.000001" class="form-control" name="longitude"
                                           th:value="${building.longitude}" placeholder="如：125.123456">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">纬度</label>
                                    <input type="number" step="0.000001" class="form-control" name="latitude"
                                           th:value="${building.latitude}" placeholder="如：46.123456">
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">开放时间</label>
                                    <input type="text" class="form-control" name="openingHours"
                                           th:value="${building.openingHours}" placeholder="如：8:00-22:00">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">图片URL</label>
                                    <input type="text" class="form-control" name="imageUrl"
                                           th:value="${building.imageUrl}" placeholder="/images/xxx.jpg 或 https://...">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">标签</label>
                                <input type="text" class="form-control" name="tags"
                                       th:value="${building.tags}" placeholder="多个标签用逗号分隔，如：自习,借书,阅览">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">描述</label>
                                <textarea class="form-control" name="description" rows="4"
                                          placeholder="建筑详细介绍" th:text="${building.description}"></textarea>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label">状态</label>
                                    <select class="form-select" name="status">
                                        <option value="1" th:selected="${building.status == null or building.status == 1}">显示</option>
                                        <option value="0" th:selected="${building.status == 0}">隐藏</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">排序</label>
                                    <input type="number" class="form-control" name="sort"
                                           th:value="${building.sort != null ? building.sort : 0}">
                                    <div class="form-text">数字越小越靠前</div>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg"></i>
                                    <span th:text="${building.id != null} ? '更新' : '添加'">操作</span>
                                </button>
                                <a th:href="@{/admin/buildings}" class="btn btn-outline-secondary">取消</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/common :: footer}"></th:block>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
