<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>专业管理 - 智慧迎新系统</title>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navbar}"></th:block>

    <section class="bg-dark text-white py-3">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-gear"></i> 后台管理 / 专业管理</h5>
                <a th:href="@{/admin}" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left"></i> 返回仪表盘</a>
            </div>
        </div>
    </section>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <small class="text-muted">共 <strong th:text="${#lists.size(majors)}">0</strong> 个专业</small>
            <a th:href="@{/admin/majors/edit}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg"></i> 新增专业
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th style="width:5%">ID</th>
                            <th style="width:16%">专业名称</th>
                            <th style="width:14%">学院</th>
                            <th style="width:10%">学位</th>
                            <th style="width:7%">学制</th>
                            <th style="width:8%">代码</th>
                            <th style="width:8%">状态</th>
                            <th style="width:6%">排序</th>
                            <th style="width:26%" class="text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="m : ${majors}">
                            <td th:text="${m.id}">1</td>
                            <td><strong th:text="${m.name}">专业名称</strong></td>
                            <td><small th:text="${m.college}">学院</small></td>
                            <td th:text="${m.degree}">学位</td>
                            <td th:text="${m.duration} + '年'">4年</td>
                            <td><code th:text="${m.code}">代码</code></td>
                            <td>
                                <span th:if="${m.status == 1}" class="badge bg-success">显示</span>
                                <span th:unless="${m.status == 1}" class="badge bg-secondary">隐藏</span>
                            </td>
                            <td th:text="${m.sort}">0</td>
                            <td class="text-center">
                                <a th:href="@{/admin/majors/edit(id=${m.id})}" class="btn btn-outline-primary btn-sm me-1">
                                    <i class="bi bi-pencil"></i> 编辑
                                </a>
                                <form th:action="@{/admin/majors/delete/{id}(id=${m.id})}" method="post"
                                      style="display:inline"
                                      onsubmit="return confirm('确定要删除专业「'+${m.name}+'」吗？');">
                                    <button class="btn btn-outline-danger btn-sm">
                                        <i class="bi bi-trash"></i> 删除
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(majors)}">
                            <td colspan="9" class="text-center text-muted py-5">
                                <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                                <p class="mt-2 mb-0">暂无专业数据，点击右上角"新增专业"开始添加</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/common :: footer}"></th:block>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
