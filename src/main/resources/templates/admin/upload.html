<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>图片上传 - 管理后台</title>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navbar}"></th:block>

    <section class="bg-dark text-white py-3">
        <div class="container">
            <h5 class="mb-0"><i class="bi bi-gear"></i> 后台管理 / 图片上传</h5>
        </div>
    </section>

    <div class="container py-4" style="max-width: 700px;">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-cloud-upload"></i> 上传图片</h5>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/admin/upload}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">选择图片</label>
                        <input type="file" name="file" class="form-control" accept="image/*" required>
                        <small class="text-muted">支持 jpg/jpeg/png/gif/webp，最大5MB</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">图片分类</label>
                        <select name="type" class="form-select">
                            <option value="building">校园建筑</option>
                            <option value="dormitory">宿舍</option>
                            <option value="cafeteria">食堂</option>
                            <option value="club">社团</option>
                            <option value="activity">活动</option>
                            <option value="teacher">教师</option>
                            <option value="news">新闻</option>
                            <option value="common">通用</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-cloud-upload"></i> 上传
                    </button>
                </form>
            </div>
        </div>

        <!-- 上传成功后显示链接 -->
        <div th:if="${imageUrl}" class="card border-0 shadow-sm">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0"><i class="bi bi-check-circle"></i> 上传成功</h5>
            </div>
            <div class="card-body p-4 text-center">
                <img th:src="${imageUrl}" class="img-fluid rounded mb-3" style="max-height: 300px;">
                <div class="input-group">
                    <input type="text" class="form-control" th:value="${imageUrl}" id="urlInput" readonly>
                    <button class="btn btn-outline-primary" onclick="copyUrl()">
                        <i class="bi bi-clipboard"></i> 复制链接
                    </button>
                </div>
                <small class="text-muted mt-2 d-block">将上面的链接填入对应数据表的 image_url 字段即可</small>
            </div>
        </div>
    </div>

    <script>
        function copyUrl() {
            const input = document.getElementById('urlInput');
            input.select();
            document.execCommand('copy');
            alert('链接已复制！');
        }
    </script>

    <th:block th:replace="~{fragments/common :: footer}"></th:block>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
