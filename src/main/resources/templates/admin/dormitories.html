<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>宿舍管理 - 智慧迎新系统</title>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navbar}"></th:block>

    <section class="bg-dark text-white py-3">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-gear"></i> 后台管理 / 宿舍管理</h5>
                <a th:href="@{/admin}" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left"></i> 返回仪表盘</a>
            </div>
        </div>
    </section>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <small class="text-muted">共 <strong th:text="${#lists.size(dormitories)}">0</strong> 条宿舍记录</small>
            <a th:href="@{/admin/dormitories/edit}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg"></i> 新增宿舍
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th style="width:5%">ID</th>
                            <th style="width:13%">宿舍名称</th>
                            <th style="width:8%">楼号</th>
                            <th style="width:10%">类型</th>
                            <th style="width:10%">房型</th>
                            <th style="width:8%">费用(年)</th>
                            <th style="width:8%">状态</th>
                            <th style="width:6%">排序</th>
                            <th style="width:32%" class="text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="d : ${dormitories}">
                            <td th:text="${d.id}">1</td>
                            <td><strong th:text="${d.name}">名称</strong></td>
                            <td th:text="${d.buildingNo}">楼号</td>
                            <td><span class="badge bg-info text-dark" th:text="${d.type}">类型</span></td>
                            <td th:text="${d.roomType}">房型</td>
                            <td>¥<span th:text="${d.fee}">0</span></td>
                            <td>
                                <span th:if="${d.status == 1}" class="badge bg-success">显示</span>
                                <span th:unless="${d.status == 1}" class="badge bg-secondary">隐藏</span>
                            </td>
                            <td th:text="${d.sort}">0</td>
                            <td class="text-center">
                                <a th:href="@{/admin/dormitories/edit(id=${d.id})}" class="btn btn-outline-primary btn-sm me-1">
                                    <i class="bi bi-pencil"></i> 编辑
                                </a>
                                <form th:action="@{/admin/dormitories/delete/{id}(id=${d.id})}" method="post"
                                      style="display:inline"
                                      onsubmit="return confirm('确定要删除宿舍「'+${d.name}+'」吗？');">
                                    <button class="btn btn-outline-danger btn-sm">
                                        <i class="bi bi-trash"></i> 删除
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(dormitories)}">
                            <td colspan="9" class="text-center text-muted py-5">
                                <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                                <p class="mt-2 mb-0">暂无宿舍数据，点击右上角"新增宿舍"开始添加</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/common :: footer}"></th:block>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
