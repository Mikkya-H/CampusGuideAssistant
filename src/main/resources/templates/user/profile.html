<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>个人中心 - 智慧迎新系统</title>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navbar}"></th:block>

    <div class="container py-5">
        <div class="row g-4">
            <!-- 左侧：个人信息卡片 -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body text-center p-4">
                        <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-3"
                             style="width: 100px; height: 100px;">
                            <i class="bi bi-person-fill text-primary" style="font-size: 3rem;"></i>
                        </div>
                        <h5 class="fw-bold" sec:authentication="name">用户名</h5>
                        <p class="text-muted small mb-0">
                            <span class="badge bg-primary" sec:authentication="principal.authorities">角色</span>
                        </p>
                    </div>
                </div>

                <div class="card border-0 shadow-sm mt-3">
                    <div class="card-body p-3">
                        <h6 class="text-primary"><i class="bi bi-info-circle"></i> 账号信息</h6>
                        <div class="small">
                            <div class="d-flex justify-content-between py-2 border-bottom" th:if="${user.realName}">
                                <span class="text-muted">姓名</span>
                                <span th:text="${user.realName}">姓名</span>
                            </div>
                            <div class="d-flex justify-content-between py-2 border-bottom" th:if="${user.studentId}">
                                <span class="text-muted">学号</span>
                                <span th:text="${user.studentId}">学号</span>
                            </div>
                            <div class="d-flex justify-content-between py-2 border-bottom" th:if="${user.college}">
                                <span class="text-muted">学院</span>
                                <span th:text="${user.college}">学院</span>
                            </div>
                            <div class="d-flex justify-content-between py-2 border-bottom" th:if="${user.phone}">
                                <span class="text-muted">手机</span>
                                <span th:text="${user.phone}">手机</span>
                            </div>
                            <div class="d-flex justify-content-between py-2" th:if="${user.email}">
                                <span class="text-muted">邮箱</span>
                                <span th:text="${user.email}">邮箱</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：编辑资料 -->
            <div class="col-lg-8">
                <!-- 消息提示 -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle"></i> <span th:text="${success}">更新成功</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}">更新失败</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- 编辑个人资料 -->
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0 fw-bold"><i class="bi bi-pencil-square"></i> 编辑个人资料</h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/user/profile}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="username" class="form-label">用户名</label>
                                    <input type="text" class="form-control" id="username"
                                           th:value="${user.username}" disabled>
                                </div>
                                <div class="col-md-6">
                                    <label for="realName" class="form-label">真实姓名</label>
                                    <input type="text" class="form-control" id="realName" name="realName"
                                           th:value="${user.realName}" placeholder="请输入真实姓名">
                                </div>
                                <div class="col-md-6">
                                    <label for="studentId" class="form-label">学号</label>
                                    <input type="text" class="form-control" id="studentId" name="studentId"
                                           th:value="${user.studentId}" placeholder="请输入学号">
                                </div>
                                <div class="col-md-6">
                                    <label for="phone" class="form-label">手机号</label>
                                    <input type="tel" class="form-control" id="phone" name="phone"
                                           th:value="${user.phone}" placeholder="请输入手机号">
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label">邮箱</label>
                                    <input type="email" class="form-control" id="email" name="email"
                                           th:value="${user.email}" placeholder="请输入邮箱">
                                </div>
                                <div class="col-md-6">
                                    <label for="college" class="form-label">学院</label>
                                    <select class="form-select" id="college" name="college">
                                        <option value="">请选择学院</option>
                                        <option value="计算机与信息技术学院" th:selected="${user.college == '计算机与信息技术学院'}">计算机与信息技术学院</option>
                                        <option value="电气信息工程学院" th:selected="${user.college == '电气信息工程学院'}">电气信息工程学院</option>
                                        <option value="机械科学与工程学院" th:selected="${user.college == '机械科学与工程学院'}">机械科学与工程学院</option>
                                        <option value="土木建筑工程学院" th:selected="${user.college == '土木建筑工程学院'}">土木建筑工程学院</option>
                                        <option value="石油工程学院" th:selected="${user.college == '石油工程学院'}">石油工程学院</option>
                                        <option value="化学化工学院" th:selected="${user.college == '化学化工学院'}">化学化工学院</option>
                                        <option value="经济管理学院" th:selected="${user.college == '经济管理学院'}">经济管理学院</option>
                                        <option value="人文科学学院" th:selected="${user.college == '人文科学学院'}">人文科学学院</option>
                                        <option value="外国语学院" th:selected="${user.college == '外国语学院'}">外国语学院</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg"></i> 保存修改
                                </button>
                                <button type="reset" class="btn btn-outline-secondary ms-2">重置</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 修改密码 -->
                <div class="card border-0 shadow-sm mt-3">
                    <div class="card-header bg-white">
                        <h5 class="mb-0 fw-bold"><i class="bi bi-key"></i> 修改密码</h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/user/change-password}" method="post">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label for="oldPassword" class="form-label">原密码</label>
                                    <input type="password" class="form-control" id="oldPassword" name="oldPassword"
                                           placeholder="请输入原密码" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="newPassword" class="form-label">新密码</label>
                                    <input type="password" class="form-control" id="newPassword" name="newPassword"
                                           placeholder="请输入新密码" required minlength="6">
                                </div>
                                <div class="col-md-4">
                                    <label for="confirmPassword" class="form-label">确认新密码</label>
                                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                           placeholder="请再次输入" required minlength="6">
                                </div>
                            </div>
                            <div class="mt-3">
                                <button type="submit" class="btn btn-warning">
                                    <i class="bi bi-key"></i> 修改密码
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/common :: footer}"></th:block>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
