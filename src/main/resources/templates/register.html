<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>注册 - 智慧迎新系统</title>
</head>
<body class="bg-light">
    <th:block th:replace="~{fragments/common :: navbar}"></th:block>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-plus-fill text-primary" style="font-size: 3rem;"></i>
                            <h3 class="mt-2 fw-bold">新用户注册</h3>
                            <p class="text-muted">注册账号，开启你的大学之旅</p>
                        </div>

                        <!-- 错误提示 -->
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}">注册失败</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- 成功提示 -->
                        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="bi bi-check-circle"></i> <span th:text="${success}">注册成功</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form th:action="@{/register}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="username" class="form-label">用户名 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="username" name="username"
                                           placeholder="请输入用户名" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="realName" class="form-label">真实姓名 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="realName" name="realName"
                                           placeholder="请输入真实姓名" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="password" class="form-label">密码 <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="password" name="password"
                                           placeholder="至少6位密码" required minlength="6">
                                </div>
                                <div class="col-md-6">
                                    <label for="confirmPassword" class="form-label">确认密码 <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                           placeholder="请再次输入密码" required minlength="6">
                                </div>
                                <div class="col-md-6">
                                    <label for="studentId" class="form-label">学号 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="studentId" name="studentId"
                                           placeholder="请输入学号" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="phone" class="form-label">手机号</label>
                                    <input type="tel" class="form-control" id="phone" name="phone"
                                           placeholder="请输入手机号">
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label">邮箱</label>
                                    <input type="email" class="form-control" id="email" name="email"
                                           placeholder="请输入邮箱地址">
                                </div>
                                <div class="col-md-6">
                                    <label for="college" class="form-label">学院</label>
                                    <select class="form-select" id="college" name="college">
                                        <option value="">请选择学院</option>
                                        <option value="计算机与信息技术学院">计算机与信息技术学院</option>
                                        <option value="电气信息工程学院">电气信息工程学院</option>
                                        <option value="机械科学与工程学院">机械科学与工程学院</option>
                                        <option value="土木建筑工程学院">土木建筑工程学院</option>
                                        <option value="石油工程学院">石油工程学院</option>
                                        <option value="化学化工学院">化学化工学院</option>
                                        <option value="经济管理学院">经济管理学院</option>
                                        <option value="人文科学学院">人文科学学院</option>
                                        <option value="外国语学院">外国语学院</option>
                                    </select>
                                </div>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-person-plus"></i> 注 册
                                </button>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <span class="text-muted">已有账号？</span>
                            <a th:href="@{/login}" class="text-decoration-none">立即登录 <i class="bi bi-arrow-right"></i></a>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <a th:href="@{/}" class="text-muted text-decoration-none small">
                        <i class="bi bi-arrow-left"></i> 返回首页
                    </a>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/common :: footer}"></th:block>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
