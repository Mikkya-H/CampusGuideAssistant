<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>常见问题 - 智慧迎新系统</title>
    <style>#mainNav{background:linear-gradient(135deg,#2563EB,#3B82F6)!important;}</style>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navbar}"></th:block>

    <!-- 页面头部 -->
    <section class="page-header page-header--faq">
        <div class="container">
            <h2 class="fw-bold mb-1"><i class="bi bi-question-circle"></i> 常见问题</h2>
            <p class="mb-0 opacity-75">解答你的入学疑问，快速找到答案</p>
        </div>
    </section>

    <div class="container py-5">
        <!-- 成功提示Toast -->
        <div th:if="${success}" class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
            <div id="successToast" class="toast align-items-center text-bg-success border-0 show" role="alert">
                <div class="d-flex">
                    <div class="toast-body fw-bold">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${success}">操作成功！</span>
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
        </div>

        <!-- 分类筛选标签 -->
        <ul class="nav nav-pills mb-4 justify-content-center" id="faqTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#faq-all" type="button" role="tab">
                    <i class="bi bi-grid"></i> 全部
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#faq-registration" type="button" role="tab">
                    <i class="bi bi-clipboard-check"></i> 报到
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#faq-dormitory" type="button" role="tab">
                    <i class="bi bi-house"></i> 住宿
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#faq-study" type="button" role="tab">
                    <i class="bi bi-book"></i> 学习
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#faq-life" type="button" role="tab">
                    <i class="bi bi-heart"></i> 生活
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#faq-transport" type="button" role="tab">
                    <i class="bi bi-bus-front"></i> 交通
                </button>
            </li>
        </ul>

        <!-- FAQ 内容 -->
        <div class="tab-content">
            <!-- 全部 -->
            <div class="tab-pane fade show active" id="faq-all" role="tabpanel">
                <div class="accordion" id="faqAllAccordion">
                    <div class="accordion-item" th:each="faq, iterStat : ${faqs}">
                        <h2 class="accordion-header" th:id="'all-heading-' + ${faq.id}">
                            <button class="accordion-button" th:classappend="${iterStat.index > 0} ? 'collapsed'"
                                    type="button" data-bs-toggle="collapse"
                                    th:data-bs-target="'#all-collapse-' + ${faq.id}"
                                    th:aria-expanded="${iterStat.index == 0}"
                                    th:aria-controls="'all-collapse-' + ${faq.id}">
                                <span class="badge bg-primary me-2" th:text="${faq.category}">分类</span>
                                <span th:text="${faq.question}">问题内容</span>
                            </button>
                        </h2>
                        <div th:id="'all-collapse-' + ${faq.id}"
                             class="accordion-collapse collapse" th:classappend="${iterStat.index == 0} ? 'show'"
                             th:aria-labelledby="'all-heading-' + ${faq.id}"
                             data-bs-parent="#faqAllAccordion">
                            <div class="accordion-body">
                                <p class="mb-0" th:text="${faq.answer}">答案内容</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 报到 -->
            <div class="tab-pane fade" id="faq-registration" role="tabpanel">
                <div class="accordion" id="faqRegistrationAccordion">
                    <div class="accordion-item" th:each="faq, iterStat : ${faqs}" th:if="${faq.category == '报到' or faq.category == '报到流程'}">
                        <h2 class="accordion-header" th:id="'reg-heading-' + ${faq.id}">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                    th:data-bs-target="'#reg-collapse-' + ${faq.id}"
                                    th:aria-expanded="false"
                                    th:aria-controls="'reg-collapse-' + ${faq.id}">
                                <span th:text="${faq.question}">问题内容</span>
                            </button>
                        </h2>
                        <div th:id="'reg-collapse-' + ${faq.id}"
                             class="accordion-collapse collapse"
                             th:aria-labelledby="'reg-heading-' + ${faq.id}"
                             data-bs-parent="#faqRegistrationAccordion">
                            <div class="accordion-body">
                                <p class="mb-0" th:text="${faq.answer}">答案内容</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 住宿 -->
            <div class="tab-pane fade" id="faq-dormitory" role="tabpanel">
                <div class="accordion" id="faqDormitoryAccordion">
                    <div class="accordion-item" th:each="faq, iterStat : ${faqs}" th:if="${faq.category == '住宿' or faq.category == '宿舍'}">
                        <h2 class="accordion-header" th:id="'dorm-heading-' + ${faq.id}">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                    th:data-bs-target="'#dorm-collapse-' + ${faq.id}"
                                    th:aria-expanded="false"
                                    th:aria-controls="'dorm-collapse-' + ${faq.id}">
                                <span th:text="${faq.question}">问题内容</span>
                            </button>
                        </h2>
                        <div th:id="'dorm-collapse-' + ${faq.id}"
                             class="accordion-collapse collapse"
                             th:aria-labelledby="'dorm-heading-' + ${faq.id}"
                             data-bs-parent="#faqDormitoryAccordion">
                            <div class="accordion-body">
                                <p class="mb-0" th:text="${faq.answer}">答案内容</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 学习 -->
            <div class="tab-pane fade" id="faq-study" role="tabpanel">
                <div class="accordion" id="faqStudyAccordion">
                    <div class="accordion-item" th:each="faq, iterStat : ${faqs}" th:if="${faq.category == '学习' or faq.category == '学业'}">
                        <h2 class="accordion-header" th:id="'study-heading-' + ${faq.id}">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                    th:data-bs-target="'#study-collapse-' + ${faq.id}"
                                    th:aria-expanded="false"
                                    th:aria-controls="'study-collapse-' + ${faq.id}">
                                <span th:text="${faq.question}">问题内容</span>
                            </button>
                        </h2>
                        <div th:id="'study-collapse-' + ${faq.id}"
                             class="accordion-collapse collapse"
                             th:aria-labelledby="'study-heading-' + ${faq.id}"
                             data-bs-parent="#faqStudyAccordion">
                            <div class="accordion-body">
                                <p class="mb-0" th:text="${faq.answer}">答案内容</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 生活 -->
            <div class="tab-pane fade" id="faq-life" role="tabpanel">
                <div class="accordion" id="faqLifeAccordion">
                    <div class="accordion-item" th:each="faq, iterStat : ${faqs}" th:if="${faq.category == '生活' or faq.category == '日常'}">
                        <h2 class="accordion-header" th:id="'life-heading-' + ${faq.id}">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                    th:data-bs-target="'#life-collapse-' + ${faq.id}"
                                    th:aria-expanded="false"
                                    th:aria-controls="'life-collapse-' + ${faq.id}">
                                <span th:text="${faq.question}">问题内容</span>
                            </button>
                        </h2>
                        <div th:id="'life-collapse-' + ${faq.id}"
                             class="accordion-collapse collapse"
                             th:aria-labelledby="'life-heading-' + ${faq.id}"
                             data-bs-parent="#faqLifeAccordion">
                            <div class="accordion-body">
                                <p class="mb-0" th:text="${faq.answer}">答案内容</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 交通 -->
            <div class="tab-pane fade" id="faq-transport" role="tabpanel">
                <div class="accordion" id="faqTransportAccordion">
                    <div class="accordion-item" th:each="faq, iterStat : ${faqs}" th:if="${faq.category == '交通' or faq.category == '出行'}">
                        <h2 class="accordion-header" th:id="'trans-heading-' + ${faq.id}">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                    th:data-bs-target="'#trans-collapse-' + ${faq.id}"
                                    th:aria-expanded="false"
                                    th:aria-controls="'trans-collapse-' + ${faq.id}">
                                <span th:text="${faq.question}">问题内容</span>
                            </button>
                        </h2>
                        <div th:id="'trans-collapse-' + ${faq.id}"
                             class="accordion-collapse collapse"
                             th:aria-labelledby="'trans-heading-' + ${faq.id}"
                             data-bs-parent="#faqTransportAccordion">
                            <div class="accordion-body">
                                <p class="mb-0" th:text="${faq.answer}">答案内容</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- 完全空状态 -->
        <div th:if="${#lists.isEmpty(faqs)}" class="text-center text-muted py-5">
            <i class="bi bi-question-circle-fill" style="font-size: 4rem;"></i>
            <h4 class="mt-3">暂无常见问题</h4>
            <p>常见问题库正在整理中，如有疑问请在下方提交</p>
        </div>

        <!-- ==================== 提问区域 ==================== -->
        <div class="card border-0 shadow-sm mt-4" id="askSection">
            <div class="card-header bg-white">
                <h5 class="mb-0 fw-bold"><i class="bi bi-chat-dots"></i> 我要提问</h5>
            </div>
            <div class="card-body">
                <div sec:authorize="isAuthenticated()">
                    <form th:action="@{/guide/faq/ask}" method="post">
                        <div class="mb-3">
                            <label class="form-label">问题分类 <span class="text-danger">*</span></label>
                            <select class="form-select" name="category" required>
                                <option value="">请选择分类</option>
                                <option value="报到">报到</option>
                                <option value="住宿">住宿</option>
                                <option value="学习">学习</option>
                                <option value="生活">生活</option>
                                <option value="交通">交通</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">问题描述 <span class="text-danger">*</span></label>
                            <textarea class="form-control" name="question" rows="3"
                                      placeholder="请详细描述你的问题，管理员会尽快回复…" required></textarea>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">
                                <i class="bi bi-info-circle"></i> 提交后需等待管理员回复，回复后会公开展示
                            </small>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-send"></i> 提交问题
                            </button>
                        </div>
                    </form>
                </div>
                <div sec:authorize="!isAuthenticated()" class="text-center py-3">
                    <i class="bi bi-lock" style="font-size: 2rem; color: #adb5bd;"></i>
                    <p class="text-muted mt-2 mb-2">请登录后提交问题</p>
                    <a th:href="@{/login}" class="btn btn-primary">
                        <i class="bi bi-box-arrow-in-right"></i> 立即登录
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast自动隐藏脚本 -->
    <script th:if="${success}">
        document.addEventListener('DOMContentLoaded', function() {
            var toastEl = document.getElementById('successToast');
            if (toastEl) {
                var toast = new bootstrap.Toast(toastEl, { delay: 3500 });
                toast.show();
            }
        });
    </script>

    <th:block th:replace="~{fragments/common :: footer}"></th:block>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
