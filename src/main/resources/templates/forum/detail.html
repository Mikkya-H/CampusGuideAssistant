<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title th:text="${post.title} + ' - 交流社区 - 智慧迎新系统'">帖子详情 - 智慧迎新系统</title>
    <style>#mainNav{background:linear-gradient(135deg,#4F46E5,#6366F1)!important;}</style>
    <style>
        .reply-quote {
            background: #f0f6ff;
            border-left: 3px solid #0D7377;
            border-radius: 0 6px 6px 0;
            padding: 6px 12px;
            margin-bottom: 4px;
            font-size: 0.875rem;
            color: #555;
        }
        .reply-btn {
            cursor: pointer;
            font-size: 0.8125rem;
            color: #6c757d;
            text-decoration: none;
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.15s;
        }
        .reply-btn:hover {
            color: #0D7377;
            background: #e7f1ff;
        }
    </style>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navbar}"></th:block>

    <div class="container py-5">
        <div th:if="${success}" class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
            <div id="successToast" class="toast align-items-center text-bg-success border-0 show" role="alert">
                <div class="d-flex">
                    <div class="toast-body fw-bold">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${success}">操作成功！</span>
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
        </div>

        <a th:href="@{/forum}" class="btn btn-outline-secondary btn-sm mb-4">
            <i class="bi bi-arrow-left"></i> 返回社区
        </a>

        <!-- ==================== 帖子主体 ==================== -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
                <div class="mb-2">
                    <span th:if="${post.isTop == 1}" class="badge bg-danger me-1">
                        <i class="bi bi-pin-angle-fill"></i> 置顶
                    </span>
                    <span class="badge bg-primary" th:text="${post.category}">分类</span>
                </div>
                <h3 class="fw-bold mb-3" th:text="${post.title}">帖子标题</h3>
                <div class="d-flex align-items-center mb-3 pb-3 border-bottom">
                    <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-3"
                         style="width:48px;height:48px;font-size:20px;flex-shrink:0;">
                        <span th:text="${post.username != null ? #strings.substring(post.username, 0, 1) : '?'}">?</span>
                    </div>
                    <div>
                        <div class="d-flex align-items-center">
                            <strong th:text="${post.username}" class="me-2">作者</strong>
                            <span class="badge bg-warning text-dark"><i class="bi bi-person-check"></i> 楼主</span>
                        </div>
                        <small class="text-muted">
                            <i class="bi bi-clock me-1"></i>
                            <span th:text="${post.createTime != null ? #temporals.format(post.createTime, 'yyyy-MM-dd HH:mm') : ''}">时间</span>
                            <span class="mx-2">|</span>
                            <i class="bi bi-eye me-1"></i><span th:text="${post.viewCount}">0</span> 浏览
                            <span class="mx-2">|</span>
                            <i class="bi bi-chat-dots me-1"></i><span th:text="${post.replyCount}">0</span> 回复
                        </small>
                    </div>
                </div>
                <div class="content fs-6" style="line-height:1.8;min-height:120px;"
                     th:utext="${post.content}">帖子内容</div>

                <!-- 删除按钮：帖子作者或管理员可见 -->
                <div th:if="${currentUserId != null and (currentUserId == post.userId or isAdmin)}"
                     class="text-end mt-3 pt-3 border-top">
                    <form th:action="@{/forum/post/{id}/delete(id=${post.id})}" method="post"
                          onsubmit="return confirm('确定要删除该帖子吗？\n\n删除后，帖子及其所有评论将一并删除，此操作不可恢复！');">
                        <button type="submit" class="btn btn-outline-danger btn-sm">
                            <i class="bi bi-trash"></i>
                            <span th:if="${isAdmin and currentUserId != post.userId}">管理员删除</span>
                            <span th:unless="${isAdmin and currentUserId != post.userId}">删除帖子</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- ==================== 评论区 ==================== -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">
                    <i class="bi bi-chat-square-text"></i> 全部评论
                    <span class="badge bg-secondary ms-2" th:text="${#lists.size(comments)}">0</span>
                </h5>
            </div>

            <div class="card-body p-0">
                <div th:if="${#lists.isEmpty(comments)}" class="text-center text-muted py-5">
                    <i class="bi bi-chat-square" style="font-size:3rem;"></i>
                    <p class="mt-3 mb-0">暂无评论，快来抢沙发吧！</p>
                </div>

                <div th:each="comment, iterStat : ${comments}" class="p-4"
                     th:classappend="${!iterStat.last ? 'border-bottom' : ''}"
                     th:id="'comment-' + ${comment.id}">

                    <!-- ====== 楼主评论 ====== -->
                    <div th:if="${comment.userId == post.userId}" class="position-relative"
                         style="border-left:3px solid #ffc107;padding-left:16px;background:linear-gradient(to right,#fff9e6,transparent);">
                        <div class="d-flex align-items-start">
                            <div class="rounded-circle bg-warning text-dark d-flex align-items-center justify-content-center me-3"
                                 style="width:40px;height:40px;font-size:16px;flex-shrink:0;">
                                <span th:text="${comment.username != null ? #strings.substring(comment.username, 0, 1) : '?'}">?</span>
                            </div>
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <div>
                                        <strong th:text="${comment.username}" class="me-2">评论者</strong>
                                        <span class="badge bg-warning text-dark"><i class="bi bi-person-check"></i> 楼主</span>
                                    </div>
                                    <div class="d-flex align-items-center">
                                        <small class="text-muted me-2" th:text="${comment.createTime != null ? #temporals.format(comment.createTime, 'yyyy-MM-dd HH:mm') : ''}">时间</small>
                                        <a class="reply-btn" sec:authorize="isAuthenticated()"
                                           th:attr="data-cid=${comment.id},data-cname=${comment.username}">
                                            <i class="bi bi-reply"></i> 回复
                                        </a>
                                    </div>
                                </div>
                                <div th:if="${comment.parentId != null}" class="reply-quote">
                                    <i class="bi bi-reply-fill me-1"></i>
                                    回复 <strong th:text="${comment.parentUsername}">@xxx</strong>
                                </div>
                                <p class="mb-0" style="line-height:1.7;" th:text="${comment.content}">评论内容</p>
                            </div>
                        </div>
                    </div>

                    <!-- ====== 普通用户评论 ====== -->
                    <div th:unless="${comment.userId == post.userId}" class="d-flex align-items-start">
                        <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-3"
                             style="width:40px;height:40px;font-size:16px;flex-shrink:0;">
                            <span th:text="${comment.username != null ? #strings.substring(comment.username, 0, 1) : '?'}">?</span>
                        </div>
                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <strong th:text="${comment.username}" class="me-2">评论者</strong>
                                <div class="d-flex align-items-center">
                                    <small class="text-muted me-2" th:text="${comment.createTime != null ? #temporals.format(comment.createTime, 'yyyy-MM-dd HH:mm') : ''}">时间</small>
                                    <a class="reply-btn" sec:authorize="isAuthenticated()"
                                       th:attr="data-cid=${comment.id},data-cname=${comment.username}">
                                        <i class="bi bi-reply"></i> 回复
                                    </a>
                                </div>
                            </div>
                            <div th:if="${comment.parentId != null}" class="reply-quote">
                                <i class="bi bi-reply-fill me-1"></i>
                                回复 <strong th:text="${comment.parentUsername}">@xxx</strong>
                            </div>
                            <p class="mb-0" style="line-height:1.7;" th:text="${comment.content}">评论内容</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 发表评论表单 ==================== -->
        <div class="card border-0 shadow-sm" id="commentForm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold" id="formTitle">
                    <i class="bi bi-pencil-square"></i> 发表评论
                </h5>
                <span id="replyIndicator" style="display:none;">
                    <span class="badge bg-info me-2" id="replyToUser"></span>
                    <button type="button" class="btn-close" onclick="cancelReply()" title="取消回复"></button>
                </span>
            </div>
            <div class="card-body">
                <div sec:authorize="isAuthenticated()">
                    <form th:action="@{/forum/post/{id}/comment(id=${post.id})}" method="post">
                        <input type="hidden" name="parentId" id="parentId" value="">
                        <div class="mb-3">
                            <textarea class="form-control" name="content" id="commentContent" rows="4"
                                      placeholder="写下你的评论，友善交流…" required></textarea>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">
                                <i class="bi bi-info-circle"></i> 文明发言，尊重他人
                            </small>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-send"></i> 发表评论
                            </button>
                        </div>
                    </form>
                </div>
                <div sec:authorize="!isAuthenticated()" class="text-center py-4">
                    <i class="bi bi-lock" style="font-size:2rem;color:#adb5bd;"></i>
                    <p class="text-muted mt-2 mb-2">请登录后参与讨论</p>
                    <a th:href="@{/login}" class="btn btn-primary">
                        <i class="bi bi-box-arrow-in-right"></i> 立即登录
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 回复功能 JS ==================== -->
    <script>
        // 事件委托：监听所有回复按钮的点击
        document.addEventListener('click', function(e) {
            var btn = e.target.closest('.reply-btn');
            if (btn) {
                e.preventDefault();
                var cid = btn.getAttribute('data-cid');
                var cname = btn.getAttribute('data-cname');
                if (cid && cname) {
                    replyTo(cid, cname);
                }
            }
        });

        function replyTo(commentId, username) {
            document.getElementById('parentId').value = commentId;
            document.getElementById('replyToUser').textContent = '@' + username;
            document.getElementById('replyIndicator').style.display = 'inline';
            document.getElementById('formTitle').innerHTML = '<i class="bi bi-reply-fill"></i> 回复 @' + username;
            document.getElementById('commentContent').placeholder = '回复 @' + username + '…';
            document.getElementById('commentContent').focus();
            document.getElementById('commentForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function cancelReply() {
            document.getElementById('parentId').value = '';
            document.getElementById('replyIndicator').style.display = 'none';
            document.getElementById('formTitle').innerHTML = '<i class="bi bi-pencil-square"></i> 发表评论';
            document.getElementById('commentContent').placeholder = '写下你的评论，友善交流…';
            document.getElementById('commentContent').focus();
        }
    </script>

    <script th:if="${success}">
        document.addEventListener('DOMContentLoaded', function() {
            var toastEl = document.getElementById('successToast');
            if (toastEl) {
                var toast = new bootstrap.Toast(toastEl, { delay: 3000 });
                toast.show();
            }
        });
    </script>

    <th:block th:replace="~{fragments/common :: footer}"></th:block>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
