<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>交流社区 - 智慧迎新系统</title>
    <style>#mainNav{background:linear-gradient(135deg,#4F46E5,#6366F1)!important;}</style>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navbar}"></th:block>

    <!-- 页面头部 -->
    <section class="page-header page-header--forum">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="fw-bold mb-1"><i class="bi bi-chat-dots"></i> 交流社区</h2>
                    <p class="mb-0 opacity-75">与同学们互动交流，分享经验与心得</p>
                </div>
                <a th:href="@{/forum/new}" class="btn btn-light" sec:authorize="isAuthenticated()">
                    <i class="bi bi-plus-lg"></i> 发布新帖
                </a>
            </div>
        </div>
    </section>

    <div class="container py-5">
        <!-- 成功提示Toast -->
        <div th:if="${success}" class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
            <div id="successToast" class="toast align-items-center text-bg-success border-0 show" role="alert">
                <div class="d-flex">
                    <div class="toast-body fw-bold">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${success}">帖子发布成功！</span>
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
        </div>

        <!-- 错误提示Toast -->
        <div th:if="${error}" class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
            <div id="errorToast" class="toast align-items-center text-bg-danger border-0 show" role="alert">
                <div class="d-flex">
                    <div class="toast-body fw-bold">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}">操作失败</span>
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
        </div>

        <!-- 分类筛选标签 -->
        <ul class="nav nav-pills mb-4 justify-content-center" id="forumTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#forum-all" type="button" role="tab">全部</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#forum-study" type="button" role="tab">学习交流</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#forum-life" type="button" role="tab">生活问答</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#forum-guide" type="button" role="tab">校园攻略</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#forum-registration" type="button" role="tab">新生报到</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#forum-club" type="button" role="tab">社团招新</button>
            </li>
        </ul>

        <!-- 空状态 -->
        <th:block th:if="${#lists.isEmpty(posts)}">
            <div class="text-center text-muted py-5">
                <i class="bi bi-chat-square" style="font-size: 4rem;"></i>
                <h4 class="mt-3">暂无帖子</h4>
                <p>还没有人发帖，快来发布第一条吧！</p>
                <a th:href="@{/forum/new}" class="btn btn-primary mt-2" sec:authorize="isAuthenticated()">
                    <i class="bi bi-plus-lg"></i> 发布新帖
                </a>
                <a th:href="@{/login}" class="btn btn-outline-primary mt-2" sec:authorize="!isAuthenticated()">
                    <i class="bi bi-box-arrow-in-right"></i> 登录后发帖
                </a>
            </div>
        </th:block>

        <!-- 帖子列表表格 -->
        <div class="tab-content" th:unless="${#lists.isEmpty(posts)}">
            <div class="tab-pane fade show active" id="forum-all" role="tabpanel">
                <div class="card border-0 shadow-sm">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 50%;">标题</th>
                                    <th>分类</th>
                                    <th>作者</th>
                                    <th class="text-center">回复</th>
                                    <th class="text-center">浏览</th>
                                    <th>发布时间</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="post : ${posts}">
                                    <td>
                                        <a th:href="@{/forum/post/{id}(id=${post.id})}" class="text-decoration-none fw-bold"
                                           th:text="${post.title}">帖子标题</a>
                                    </td>
                                    <td>
                                        <span class="badge bg-primary" th:text="${post.category}">分类</span>
                                    </td>
                                    <td>
                                        <small class="text-muted" th:text="${post.username}">作者</small>
                                    </td>
                                    <td class="text-center">
                                        <small th:text="${post.replyCount}">0</small>
                                    </td>
                                    <td class="text-center">
                                        <small th:text="${post.viewCount}">0</small>
                                    </td>
                                    <td>
                                        <small class="text-muted" th:text="${#temporals.format(post.createTime, 'MM-dd HH:mm')}">时间</small>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 各分类tab (用JavaScript过滤，简化处理) -->
            <div class="tab-pane fade" id="forum-study" role="tabpanel">
                <div class="card border-0 shadow-sm">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 50%;">标题</th>
                                    <th>作者</th>
                                    <th class="text-center">回复</th>
                                    <th class="text-center">浏览</th>
                                    <th>发布时间</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="post : ${posts}" th:if="${post.category == '学习交流'}">
                                    <td>
                                        <a th:href="@{/forum/post/{id}(id=${post.id})}" class="text-decoration-none fw-bold"
                                           th:text="${post.title}">帖子标题</a>
                                    </td>
                                    <td><small class="text-muted" th:text="${post.username}">作者</small></td>
                                    <td class="text-center"><small th:text="${post.replyCount}">0</small></td>
                                    <td class="text-center"><small th:text="${post.viewCount}">0</small></td>
                                    <td><small class="text-muted" th:text="${#temporals.format(post.createTime, 'MM-dd HH:mm')}">时间</small></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="forum-life" role="tabpanel">
                <div class="card border-0 shadow-sm">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 50%;">标题</th>
                                    <th>作者</th>
                                    <th class="text-center">回复</th>
                                    <th class="text-center">浏览</th>
                                    <th>发布时间</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="post : ${posts}" th:if="${post.category == '生活问答'}">
                                    <td>
                                        <a th:href="@{/forum/post/{id}(id=${post.id})}" class="text-decoration-none fw-bold"
                                           th:text="${post.title}">帖子标题</a>
                                    </td>
                                    <td><small class="text-muted" th:text="${post.username}">作者</small></td>
                                    <td class="text-center"><small th:text="${post.replyCount}">0</small></td>
                                    <td class="text-center"><small th:text="${post.viewCount}">0</small></td>
                                    <td><small class="text-muted" th:text="${#temporals.format(post.createTime, 'MM-dd HH:mm')}">时间</small></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="forum-guide" role="tabpanel">
                <div class="card border-0 shadow-sm">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 50%;">标题</th>
                                    <th>作者</th>
                                    <th class="text-center">回复</th>
                                    <th class="text-center">浏览</th>
                                    <th>发布时间</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="post : ${posts}" th:if="${post.category == '校园攻略'}">
                                    <td>
                                        <a th:href="@{/forum/post/{id}(id=${post.id})}" class="text-decoration-none fw-bold"
                                           th:text="${post.title}">帖子标题</a>
                                    </td>
                                    <td><small class="text-muted" th:text="${post.username}">作者</small></td>
                                    <td class="text-center"><small th:text="${post.replyCount}">0</small></td>
                                    <td class="text-center"><small th:text="${post.viewCount}">0</small></td>
                                    <td><small class="text-muted" th:text="${#temporals.format(post.createTime, 'MM-dd HH:mm')}">时间</small></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="forum-registration" role="tabpanel">
                <div class="card border-0 shadow-sm">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 50%;">标题</th>
                                    <th>作者</th>
                                    <th class="text-center">回复</th>
                                    <th class="text-center">浏览</th>
                                    <th>发布时间</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="post : ${posts}" th:if="${post.category == '新生报到'}">
                                    <td>
                                        <a th:href="@{/forum/post/{id}(id=${post.id})}" class="text-decoration-none fw-bold"
                                           th:text="${post.title}">帖子标题</a>
                                    </td>
                                    <td><small class="text-muted" th:text="${post.username}">作者</small></td>
                                    <td class="text-center"><small th:text="${post.replyCount}">0</small></td>
                                    <td class="text-center"><small th:text="${post.viewCount}">0</small></td>
                                    <td><small class="text-muted" th:text="${#temporals.format(post.createTime, 'MM-dd HH:mm')}">时间</small></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="forum-club" role="tabpanel">
                <div class="card border-0 shadow-sm">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 50%;">标题</th>
                                    <th>作者</th>
                                    <th class="text-center">回复</th>
                                    <th class="text-center">浏览</th>
                                    <th>发布时间</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="post : ${posts}" th:if="${post.category == '社团招新'}">
                                    <td>
                                        <a th:href="@{/forum/post/{id}(id=${post.id})}" class="text-decoration-none fw-bold"
                                           th:text="${post.title}">帖子标题</a>
                                    </td>
                                    <td><small class="text-muted" th:text="${post.username}">作者</small></td>
                                    <td class="text-center"><small th:text="${post.replyCount}">0</small></td>
                                    <td class="text-center"><small th:text="${post.viewCount}">0</small></td>
                                    <td><small class="text-muted" th:text="${#temporals.format(post.createTime, 'MM-dd HH:mm')}">时间</small></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast自动隐藏脚本 -->
    <script th:if="${success}">
        document.addEventListener('DOMContentLoaded', function() {
            var toastEl = document.getElementById('successToast');
            if (toastEl) {
                var toast = new bootstrap.Toast(toastEl, { delay: 3000 });
                toast.show();
            }
        });
    </script>

    <th:block th:replace="~{fragments/common :: footer}"></th:block>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
