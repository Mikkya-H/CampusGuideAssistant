<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>发布新帖 - 智慧迎新系统</title>
    <style>#mainNav{background:linear-gradient(135deg,#4F46E5,#6366F1)!important;}</style>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navbar}"></th:block>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <a th:href="@{/forum}" class="btn btn-outline-secondary btn-sm mb-4">
                    <i class="bi bi-arrow-left"></i> 返回社区
                </a>

                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white">
                        <h4 class="mb-0 fw-bold"><i class="bi bi-plus-square"></i> 发布新帖</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/forum/new}" method="post">
                            <div class="mb-3">
                                <label for="title" class="form-label">标题 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="title" name="title"
                                       placeholder="请输入帖子标题" required>
                            </div>
                            <div class="mb-3">
                                <label for="category" class="form-label">分类 <span class="text-danger">*</span></label>
                                <select class="form-select" id="category" name="category" required>
                                    <option value="">请选择分类</option>
                                    <option value="学习交流">学习交流</option>
                                    <option value="生活问答">生活问答</option>
                                    <option value="校园攻略">校园攻略</option>
                                    <option value="新生报到">新生报到</option>
                                    <option value="社团招新">社团招新</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label for="content" class="form-label">内容 <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="content" name="content" rows="10"
                                          placeholder="请输入帖子内容..." required></textarea>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-send"></i> 发布帖子
                                </button>
                                <a th:href="@{/forum}" class="btn btn-outline-secondary">取消</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/common :: footer}"></th:block>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
