<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title th:text="${news.title} + ' - 新闻公告 - 智慧迎新系统'">新闻详情 - 智慧迎新系统</title>
    <style>#mainNav{background:linear-gradient(135deg,#0284C7,#0EA5E9)!important;}</style>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navbar}"></th:block>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <a th:href="@{/news}" class="btn btn-outline-secondary btn-sm mb-4">
                    <i class="bi bi-arrow-left"></i> 返回新闻列表
                </a>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-5">
                        <div class="mb-3">
                            <span class="badge bg-primary" th:text="${news.category}">分类</span>
                        </div>
                        <h2 class="fw-bold mb-3" th:text="${news.title}">新闻标题</h2>
                        <div class="d-flex flex-wrap text-muted small mb-4 pb-3 border-bottom">
                            <span th:if="${news.author}">
                                <i class="bi bi-person"></i> <span th:text="${news.author}">作者</span>
                                <span class="mx-2">|</span>
                            </span>
                            <span th:if="${news.createTime}">
                                <i class="bi bi-calendar"></i>
                                <span th:text="${#temporals.format(news.createTime, 'yyyy-MM-dd HH:mm')}">发布时间</span>
                            </span>
                            <span class="mx-2">|</span>
                            <span>
                                <i class="bi bi-eye"></i> <span th:text="${news.viewCount}">浏览</span> 次
                            </span>
                        </div>
                        <div class="content" th:utext="${news.content}">
                            新闻详细内容
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/common :: footer}"></th:block>
    <th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
